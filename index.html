<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade & Tally Class</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- INTRO / TUTORIAL SCREEN -->
    <div id="intro-screen" class="screen active">
        <div id="intro-overlay">
            <img id="start-btn" src="ui/start_btn.png" alt="Start Lesson">
        </div>
    </div>

    <!-- MAIN GAME BOARD -->
    <div id="game-screen" class="screen">
        
        <div id="game-ui-header">
            <div id="round-display">Round: 1 / 10</div>
            <div id="score-display">Score: 0 / 2000</div>
        </div>
        
        <div id="game-layout">
            <!-- LEFT/CENTER: CONVEYOR BELT -->
            <div id="conveyor-container">
                <div id="moving-belt"></div>
                <div id="static-frame"></div>
                <!-- Items spawn here -->
                <div id="item-track"></div> 
            </div>

            <!-- RIGHT: DROP BOXES -->
            <div id="boxes-container"></div>
        </div>

    </div>

    <!-- GAME OVER SCREEN -->
    <div id="game-over-screen" class="screen">
        <img id="game-over-img" src="ui/game-over-screen.png" alt="Shipment Ruined">
        <p id="fail-reason-text"></p>
        <button id="restart-btn">Try Again</button>
    </div>

    <!-- VICTORY SCREEN -->
    <div id="victory-screen" class="screen">
        <div class="victory-content">
            <h2>Class Complete!</h2>
            <p>You have perfectly packed all shipments.</p>
            <p>Final Score: 2000 / 2000</p>
            <button id="return-hub-btn">Return to Hub (+100 EXP)</button>
        </div>
    </div>

    <script src="js/game.js"></script>
</body>
</html>
